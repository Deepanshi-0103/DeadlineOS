<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DeadlineOS — Extension Settings</title>
  <style>
    :root {
      --brand: #E3542F;
      --brand-hover: #C94428;
      --ink: #14161A;
      --ink-muted: #5A606C;
      --ink-faint: #94969A;
      --surface: #FFFFFF;
      --base: #F5F6F8;
      --line: #DCE0E4;
      --safe: #1A9B6C;
      --safe-soft: rgba(26,155,108,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--base);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 28px -12px rgba(227, 84, 47, 0.15);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand), #F0A500);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 18px;
    }
    .logo-text { font-size: 20px; font-weight: 700; }
    .logo-text strong { color: var(--brand); }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    p.desc { font-size: 13px; color: var(--ink-muted); margin-bottom: 24px; line-height: 1.5; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 10px; font-size: 13px; color: var(--ink);
      background: var(--base); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(227,84,47,0.10); }
    .hint { font-size: 11px; color: var(--ink-faint); margin-top: 6px; }
    .btn {
      margin-top: 20px; width: 100%; padding: 11px;
      border: none; border-radius: 10px; cursor: pointer;
      font-size: 13px; font-weight: 700; transition: all 0.15s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--brand), #D4612A);
      color: #fff; box-shadow: 0 4px 14px -3px rgba(227,84,47,0.40);
    }
    .btn-primary:hover { background: var(--brand-hover); }
    .saved-msg {
      margin-top: 12px; padding: 10px 12px;
      background: var(--safe-soft); border: 1px solid rgba(26,155,108,0.2);
      border-radius: 8px; color: var(--safe); font-size: 12px; font-weight: 600;
      display: none;
    }
    .divider { border: none; border-top: 1px solid var(--line); margin: 24px 0; }
    .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .preset-btn {
      padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px;
      font-size: 11px; font-weight: 600; color: var(--ink-muted); cursor: pointer;
      background: var(--surface); transition: all 0.12s;
    }
    .preset-btn:hover { border-color: var(--brand); color: var(--brand); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">D</div>
      <div class="logo-text">Deadline<strong>OS</strong></div>
    </div>

    <h1>Extension Settings</h1>
    <p class="desc">Configure which DeadlineOS server the extension connects to. Change this if you've deployed your own instance.</p>

    <label for="base-url">Server URL</label>
    <input id="base-url" type="url" placeholder="http://localhost:3001" />
    <p class="hint">Must include the protocol (http:// or https://) and no trailing slash.</p>

    <div class="presets">
      <button class="preset-btn" data-url="http://localhost:3000">localhost:3000</button>
      <button class="preset-btn" data-url="http://localhost:3001">localhost:3001</button>
    </div>

    <hr class="divider" />

    <button class="btn btn-primary" id="btn-save">Save settings</button>
    <div class="saved-msg" id="saved-msg">✓ Settings saved and synced across your Chrome instances.</div>
  </div>

  <script src="options.js"></script>
</body>
</html>
